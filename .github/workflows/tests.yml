name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.9", "3.13", "3.14"]
        exclude:
          - os: ubuntu-latest
            python: "3.9"
        include:
          # ubuntu-latest (26.04) has no Python 3.9 build.
          - os: ubuntu-24.04
            python: "3.9"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt
      - run: python -m pytest tests -q -p no:cacheprovider

  browser:
    # Playwright 1.55.0 cannot install Chromium on ubuntu-latest (26.04).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest tests/test_frontend_startup.py -q --browser chromium --tracing retain-on-failure --output .playwright-artifacts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-traces
          path: .playwright-artifacts/